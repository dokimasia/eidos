# yaml-language-server: $schema=../../spec.schema.json
name: read-your-writes
form: mixin
claim: >
  A read by a client never returns a value older than the client's own last
  write.
observation: >
  A check runs a trace of writes and reads of one client, and compares the
  version of each read, from the field that the version param refers to,
  with the version of the client's last write.
params:
  - {key: version, type: reference, resolve: value-field, doc: the field of the value that contains its version}
falsifiability: >
  A subject that serves a read from a replica behind the client's write
  returns an older version, and the check turns red.
counterexamples:
  edge: a read by another client, which the claim does not cover
