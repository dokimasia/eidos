# yaml-language-server: $schema=../../spec.schema.json
name: aggregator
form: shape
detected: true
claim: >
  The callable takes no input, and returns one value computed over its
  whole collection, with or without an error.
observation: >
  A check fills the collection through a sibling writer, and compares the
  returned value with the value that it computes over the stored records.
bindings:
  value: {from: result, index: 0, doc: the return of the computed value}
falsifiability: >
  Deleting the subject's aggregation returns a constant, and the check of a
  filled collection turns red.
counterexamples:
  edge: an empty collection
  refused: a callable that returns two or more values, which is a multi aggregator
precedence:
  yields_to: [stream-reader, predicate, computation]
