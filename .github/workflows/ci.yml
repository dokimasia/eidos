name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The toolchain harnesses skip a missing compiler locally and
      # fail on one in CI, so the job installs every compiler they
      # drive: tsc and node, javac and java, and cargo with rustfmt.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install TypeScript
        run: npm install --global typescript@7.0.2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - name: Install ergon
        run: go install go.thesmos.sh/ergon/cmd/ergon@v1.11.1
      - run: ergon bootstrap
      # make check runs ergon check under the Makefile's memory limit,
      # which contains the mutation stage. The gate's lint stage runs
      # govulncheck.
      - run: make check
      # The matrix test writes the support matrix into its artifact
      # directory. With -artifacts, Go keeps the directory under
      # _artifacts in the output directory, which must exist, and the
      # job uploads it.
      - name: Generate the support matrix
        run: >-
          go test -C eidos-conformance -count=1 -run '^TestMarkdown$'
          -artifacts -outputdir="$RUNNER_TEMP" ./matrix
      - uses: actions/upload-artifact@v7
        with:
          name: support-matrix
          path: ${{ runner.temp }}/_artifacts
