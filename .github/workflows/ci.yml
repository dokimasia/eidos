# Managed by ergon init, with .ergon/local/.github/workflows/ci.yml merged in. Change the repository's settings there and run ergon init sync.
#
# The gate of the repository, with the jobs that each producer of ergon init contributes. A check
# of text runs on the Linux runner of the section github of .ergon.yaml, and every other job on a
# matrix of runners. A job that sets up a toolchain runs its steps once the repository has the
# files of the toolchain, and sets the toolchain up before ergon. A job that runs tools keeps the
# tools of ergon in the cache of GitHub Actions, and removes the tools that the options do not name
# before the cache saves them. version.yml opens the version pull request after the run of a push
# to main passes, and release.yml publishes a commit only when a run of the gate passed on its
# content. A new run of a pull request cancels its earlier run, and every other run has a
# concurrency group of its own.
#
# The job skip runs first. Every other job skips when a passed run already covers the content of
# the run: a push whose content passed, such as the merge of a pull request whose run passed, and a
# version commit whose parent passed, which version.yml marks with the status ergon/version. The
# job result passes when every job passed or skipped, so it is the one check that a branch requires.

name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every command runs in bash, which is Git Bash on Windows.
defaults:
  run:
    shell: bash
jobs:
  skip:
    name: Skip a tested commit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - name: Find a passed run that covers the content
        id: skip
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ergon release ci skip --commit "$COMMIT"
  docs:
    name: Docs
    needs: skip
    if: "needs.skip.outputs.skip != 'true'"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md\n#node_modules"
  commits:
    name: Commits
    needs: skip
    if: "needs.skip.outputs.skip != 'true' && (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]')"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - name: Keep the tools of ergon
        id: ergon-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "ergon-tools-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('.ergon.yaml', '.ergon/init.lock') }}"
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/ergon/tools' || runner.os == 'macOS' && '~/Library/Caches/ergon/tools' || '~/.cache/ergon/tools' }}"
          restore-keys: "ergon-tools-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-"
      - name: Check the commit messages
        env:
          BASE: "${{ github.event.pull_request.base.sha }}"
          HEAD: "${{ github.event.pull_request.head.sha }}"
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$commit" | ergon tool run common.commitlint -- lint || status=1
          done
          exit "$status"
      - name: Prune the tools of ergon
        if: "steps.ergon-tools.outputs.cache-hit != 'true'"
        run: |
          ergon tool prune
  changeset:
    name: Changeset
    needs: skip
    if: "needs.skip.outputs.skip != 'true' && (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && !(github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == format('ergon-release/{0}', github.base_ref)))"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - name: Check the changesets
        env:
          BASE: "${{ github.event.pull_request.base.sha }}"
        run: |
          ergon release status --since "$BASE"
  baseline:
    name: Baseline
    needs: skip
    if: "needs.skip.outputs.skip != 'true'"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - name: Check the managed files
        run: |
          ergon init check
  license:
    name: License
    needs: skip
    if: "needs.skip.outputs.skip != 'true'"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - name: Check the license headers
        run: |
          ergon license check
  check-go:
    name: "Go (${{ matrix.os }})"
    needs: skip
    if: "needs.skip.outputs.skip != 'true'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: "hashFiles('**/go.mod') != ''"
        uses: ./.github/actions/setup-make
      - name: Require go.work
        if: "hashFiles('**/go.mod') != '' && (hashFiles('go.work') == '')"
        run: |
          echo "::error::The targets of Go run in the modules of go.work, which the repository lacks."
          exit 1
      - name: Set up Go
        if: "hashFiles('**/go.mod') != ''"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: "**/go.sum"
          go-version-file: go.work
      - name: Set up Node.js
        if: "hashFiles('**/go.mod') != ''"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install TypeScript
        if: "hashFiles('**/go.mod') != ''"
        run: |
          npm install --global typescript@7.0.2
      - name: Set up Java
        if: "hashFiles('**/go.mod') != ''"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Install Rust
        if: "hashFiles('**/go.mod') != ''"
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - if: "hashFiles('**/go.mod') != ''"
        uses: ./.github/actions/setup-ergon
      - name: Keep the tools of ergon
        id: ergon-tools
        if: "hashFiles('**/go.mod') != ''"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "ergon-tools-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('.ergon.yaml', '.ergon/init.lock', 'go.work') }}"
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/ergon/tools' || runner.os == 'macOS' && '~/Library/Caches/ergon/tools' || '~/.cache/ergon/tools' }}"
          restore-keys: "ergon-tools-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-"
      - name: Check Go
        if: "hashFiles('**/go.mod') != ''"
        run: |
          make --keep-going check-go
      - name: Prune the tools of ergon
        if: "hashFiles('**/go.mod') != '' && (steps.ergon-tools.outputs.cache-hit != 'true')"
        run: |
          ergon tool prune
      - name: Generate the support matrix
        if: runner.os == 'Linux'
        run: >-
          go test -C eidos-conformance -count=1 -run '^TestMarkdown$' -artifacts -outputdir="$RUNNER_TEMP" ./matrix
      - name: Upload the support matrix
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-matrix
          path: ${{ runner.temp }}/_artifacts
  result:
    name: Result
    if: always()
    needs: [skip, docs, commits, changeset, baseline, license, check-go]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Require every job to pass or to skip
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
