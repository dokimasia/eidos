edition = "2026";

package svc.ed26;

option features.field_presence = EXPLICIT;
option features.utf8_validation = VERIFY;

export message Row {
  string name = 1;
  int64 size = 2 [features.field_presence = IMPLICIT];

  oneof body {
    string text = 3;
  }
}

service Store {
  rpc Get(Row) returns (Row);
}
