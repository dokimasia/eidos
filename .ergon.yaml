name: eidos
modules: []

license:
  config_file: .go-license.yml
  exclude_dirs: [.git, .topoi, vendor, dist, node_modules, testdata]
  exclude_files:
    - "*.gen.go"
    - "*.gen_test.go"

lint:
  enabled: []
  disabled: []
  error_prefix:
    target_dirs: ["."]
    excludes: []

markdown:
  globs:
    - "**/*.md"
    - "#.topoi"
    - "#vendor"
    - "#dist"
    - "#node_modules"

test:
  cpu: 4
  count: 2
  timeout: 10m
  race_count: 3
  bench_count: 3
  fuzz_time: 30s

bench:
  baseline_path: bench/baseline.txt
  thresholds:
    time_percent: 25
    bytes_percent: 10
    allocs_percent: 0

checks:
  enabled: []
  disabled: [coverage]

  excludes:
    - path: "**/*_test.go"
      reason: tests are the gate, not its subject

  skips: []

  coverage:
    packages:
      - path: eidos-core/...
        line: 85
      - path: eidos-lang-go/...
        line: 75
      - path: eidos-lang-java/...
        line: 75
      - path: eidos-lang-kotlin/...
        line: 75
      - path: eidos-lang-php/...
        line: 75
      - path: eidos-lang-protobuf/...
        line: 75
      - path: eidos-lang-rust/...
        line: 75
      - path: eidos-lang-typescript/...
        line: 75
      - path: eidos-plugin-shape/...
        line: 75
      - path: eidos-reference/...
        line: 75
    top_n: 10

  mutation:
    packages: []
    gremlins:
      workers: 2
      test_cpu: 2
      timeout_coefficient: 30

  commit_msg:
    types:
      - feat
      - fix
      - docs
      - refactor
      - test
      - ci
      - chore
      - perf
      - build
      - deps
      - revert
    scopes:
      - core
      - go
      - java
      - kotlin
      - php
      - protobuf
      - rust
      - typescript
      - shape
      - reference
    max_subject_length: 80
    body_max_line_length: 100
