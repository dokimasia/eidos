name: eidos
modules: []

license:
  config_file: .go-license.yml
  exclude_dirs: [.git, .topoi, vendor, dist, node_modules, testdata]
  exclude_files:
    - "*.gen.go"
    - "*.gen_test.go"

lint:
  enabled: []
  disabled: []
  error_prefix:
    target_dirs: ["."]
    excludes: []

markdown:
  globs:
    - "**/*.md"
    - "#.topoi"
    - "#vendor"
    - "#dist"
    - "#node_modules"

test:
  cpu: 4
  count: 2
  timeout: 10m
  race_count: 3
  bench_count: 3
  fuzz_time: 30s

bench:
  baseline_path: bench/baseline.txt
  thresholds:
    time_percent: 25
    bytes_percent: 10
    allocs_percent: 0

checks:
  enabled: []
  disabled: []

  excludes:
    - path: "**/*_test.go"
      reason: tests are the gate, not its subject
    - path: "eidos-sdk/**"
      reason: generated re-exports; the mirror guard and the satellites' suites are the tests

  skips: []

  # Each floor sits under the layer's measured coverage with room for
  # ordinary work, so the gate catches a regression rather than every
  # commit that adds a branch. Raise a floor when its layer settles
  # above it; never lower one to make a red build green.
  coverage:
    packages:
      - path: eidos-conformance/...
        line: 90
      - path: eidos-core/...
        line: 95
      - path: eidos-lang/...
        line: 90
      - path: eidos-lang-go/...
        line: 85
      - path: eidos-lang-java/...
        line: 90
      - path: eidos-lang-protobuf/...
        line: 90
      - path: eidos-lang-rust/...
        line: 90
      - path: eidos-lang-typescript/...
        line: 85
      # The remaining modules hold a package comment and no
      # declarations, so their coverage is 0 of 0 statements and any
      # floor fails them. Each takes an entry when it holds code:
      # eidos-lang-kotlin, eidos-lang-php, eidos-plugin-shape,
      # eidos-reference.
    top_n: 10

  mutation:
    packages:
      # The kernel's root package takes no entry: a path of
      # eidos-core/ selects the whole module, so it re-mutates every
      # layer below at once. Its own files stay unmeasured until a
      # path form that stops at the package exists.
      - path: eidos-core/symbol/...
        score: 80
        coverage: 80
      - path: eidos-core/position/...
        score: 80
        coverage: 80
      - path: eidos-core/diag/...
        score: 80
        coverage: 80
      - path: eidos-core/meta/...
        score: 80
        coverage: 80
      - path: eidos-core/directive/...
        score: 80
        coverage: 80
      - path: eidos-core/rules/...
        score: 80
        coverage: 80
      # store sizes every index from its tallies before filling any,
      # so a mutant that changes a capacity hint changes no observable
      # behaviour and no test can kill it. Its whole surviving set is
      # that code, which is why its floor sits below the rest.
      - path: eidos-core/store/...
        score: 70
        coverage: 80
      - path: eidos-core/emit/...
        score: 80
        coverage: 80
      - path: eidos-core/node/...
        score: 80
        coverage: 80
      - path: eidos-core/output/...
        score: 80
        coverage: 80
      - path: eidos-core/plugin/...
        score: 80
        coverage: 80
      - path: eidos-core/backend/...
        score: 80
        coverage: 80
      # frontend kills every mutant its tests reach, so its floor
      # sits above the rest with room for ordinary work. What it
      # does not reach is the scripted stand-in's statement switch:
      # Go instruments a case body and not the case condition, so
      # those mutants never run and never score.
      - path: eidos-core/frontend/...
        score: 90
        coverage: 80
      - path: eidos-core/workspace/...
        score: 80
        coverage: 80
    gremlins:
      workers: 2
      test_cpu: 2
      timeout_coefficient: 30

  commit_msg:
    types:
      - feat
      - fix
      - docs
      - refactor
      - test
      - ci
      - chore
      - perf
      - build
      - deps
      - revert
    scopes:
      - conformance
      - core
      - lang
      - go
      - java
      - kotlin
      - php
      - protobuf
      - rust
      - typescript
      - shape
      - reference
      - sdk
    max_subject_length: 80
    body_max_line_length: 100
