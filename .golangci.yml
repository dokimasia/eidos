# Managed by ergon init, with .ergon/local/.golangci.yml merged in. Change the repository's settings there and run ergon init sync.
#
# The configuration of golangci-lint for every module of the repository. It enables each linter
# that a Go repository of the baseline enables, with the strictest setting that one of them uses.
# A repository adds its own settings in its local file, which merges into this one: maps key by
# key, lists appended. The depguard rules of the repository's module boundaries go there.

version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true
  relative-path-mode: gomod
output:
  show-stats: true
  sort-order:
    - linter
    - severity
    - file
linters:
  default: none
  enable:
    # Correctness
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnil
    - predeclared
    - reassign
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    # Modernization
    - modernize
    - unparam
    # Performance
    - bodyclose
    - gocritic
    - mirror
    - noctx
    - perfsprint
    - prealloc
    # Architecture and style
    - decorder
    - depguard
    - dupl
    - dupword
    - forbidigo
    - funcorder
    - goconst
    - interfacebloat
    - misspell
    - musttag
    - nolintlint
    - revive
    - sloglint
    - usestdlibvars
    - whitespace
    - wrapcheck
    # Concurrency
    - asasalint
    - containedctx
    - contextcheck
    - errname
    - fatcontext
    - spancheck
    # Test hygiene
    - paralleltest
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - usetesting
    # The analyzers of go.lint.analyzers and the module plugins of go.lint.plugins, which ergon tool
    # run builds into golangci-lint
    - assertlint
    - errorprefix
    - skipexpiry
  settings:
    asasalint:
      use-builtin-exclusions: true
    copyloopvar:
      check-alias: true
    # golangci-lint loads each analyzer and module plugin from its program. A repository sets the
    # settings of a plugin in its local file, under the name of the plugin.
    custom:
      assertlint:
        type: module
      errorprefix:
        type: module
      skipexpiry:
        type: module
    decorder:
      disable-dec-order-check: true
      disable-init-func-first-check: false
    # depguard allows only the standard library in a module without rules, so this rule denies
    # the packages that the standard library or a successor replaces, and allows everything else.
    # A repository adds the rules of its module boundaries in its local file.
    depguard:
      rules:
        replaced:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: io/ioutil$
              desc: io/ioutil is deprecated, so use io and os
            - pkg: github.com/pkg/errors
              desc: wrap with fmt.Errorf and %w, and match with errors.Is and errors.As
            - pkg: golang.org/x/exp/slices$
              desc: use slices of the standard library
            - pkg: golang.org/x/exp/maps$
              desc: use maps of the standard library
            - pkg: golang.org/x/net/context$
              desc: use context of the standard library
            - pkg: github.com/golang/protobuf
              desc: github.com/golang/protobuf is deprecated, so use google.golang.org/protobuf
        # Plugin modules import the SDK facade alone, and the kernel arrives transitively through
        # go.dokimi.dev/eidos/sdk, so a regrouping of the kernel moves no plugin's import path.
        # The tools module of the shape catalog is not listed, and neither are the composition of
        # eidos-reference at the root of its module, its binary and the fixture of its tests. Each
        # is host side and composes or loads the workspace, which the facade does not re-export.
        plugin-modules:
          files:
            - "**/eidos-lang/**"
            - "**/eidos-lang-go/**"
            - "**/eidos-lang-java/**"
            - "**/eidos-lang-kotlin/**"
            - "**/eidos-lang-php/**"
            - "**/eidos-lang-protobuf/**"
            - "**/eidos-lang-rust/**"
            - "**/eidos-lang-typescript/**"
            - "**/eidos-plugin-shape/**"
            - "!**/eidos-plugin-shape/tools/**"
            - "**/eidos-reference/**"
            - "!**/eidos-reference/*.go"
            - "!**/eidos-reference/cmd/**"
            - "!**/eidos-reference/internal/referencetest/**"
          deny:
            - pkg: go.dokimi.dev/eidos/core
              desc: plugin source speaks the facade; import go.dokimi.dev/eidos/sdk instead
        # The shape catalog is language-neutral: a detector reads the projection of a callable,
        # and a composition supplies the language. The tools module composes the Go backend, so
        # it is not listed.
        shape-catalog:
          files:
            - "**/eidos-plugin-shape/**"
            - "!**/eidos-plugin-shape/tools/**"
          deny:
            - pkg: go.dokimi.dev/eidos/lang
              desc: the catalog reads the projection of the SDK facade; a composition supplies the language
        # The read side parses source into the graph and never renders: core/frontend reaches the
        # store and the node builders, and knows nothing of emit or the write side.
        frontend-seam:
          files:
            - "**/eidos-core/frontend/**"
          deny:
            - pkg: go.dokimi.dev/eidos/core/emit
              desc: the read side loads declarations; emit is the write side's vocabulary
            - pkg: go.dokimi.dev/eidos/core/backend
              desc: the read side never renders
        # The write side renders a settled store and never loads: core/backend works on the SPI
        # and the emit vocabulary, and reaches neither the graph builders nor the read side.
        backend-seam:
          files:
            - "**/eidos-core/backend/**"
          deny:
            - pkg: go.dokimi.dev/eidos/core/node
              desc: the write side renders what the store settled; node builds the graph
            - pkg: go.dokimi.dev/eidos/core/store
              desc: the write side reads its subjects through the render context, not the store
            - pkg: go.dokimi.dev/eidos/core/frontend
              desc: the write side never loads
        # One layer in eidos-lang binds tree-sitter: it wraps the runtime binding and pins the
        # grammars, so a change of binding changes one module, and the binding's leaks stay behind
        # the functions the layer calls.
        tree-sitter:
          files:
            - "$all"
            - "!**/eidos-lang/treesitter/**"
          deny:
            - pkg: github.com/tree-sitter
              desc: parse through go.dokimi.dev/eidos/lang/treesitter, the one package that binds tree-sitter
        # A frontend reads bytes through its unit's door and the load's stores, which fold every
        # byte into a unit key. A tool's output is bytes no key folds, so no frontend runs one.
        frontend-tools:
          files:
            - "**/frontend/**"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: a frontend runs no tool; read through the unit's door or a store
    exhaustive:
      default-signifies-exhaustive: true
      check:
        - switch
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: return an error instead of a panic
        - pattern: ^(fmt\.(Print|Printf|Println)|print|println)$
          msg: write to an io.Writer that the caller passes, or log through log/slog
        - pattern: ^emit\.(AppendSealed|Seal)$
          msg: the kernel alone writes into a sealed slot; append through the slot view of the emitter
    funcorder:
      constructor: true
      struct-method: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
    govet:
      enable-all: true
    interfacebloat:
      max: 10
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      severity: error
      confidence: 0.1
      rules:
        - name: blank-imports
        # thelper requires the test first in a helper, so a helper takes its context second.
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redundant-import-alias
        - name: time-naming
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unused-receiver
        - name: var-naming
    # revive checks the package comments and the names, so staticcheck runs every other check.
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    # Every test file declares the package x_test, so a test calls only what its package exports.
    # The pattern matches no file name, and an empty pattern would match every one.
    testpackage:
      skip-regexp: "^$"
    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-mkdir-temp: true
      os-temp-dir: true
    whitespace:
      multi-if: true
      multi-func: false
    # An error that the constructor of an error, a wrap, a join or a context returns already
    # carries its cause, and a walk of a file tree returns the error of the caller's own function,
    # so neither needs a second wrap.
    wrapcheck:
      ignore-sig-regexps:
        - \.New.*Error\(
        - \.(Wrap|Wrapf)\(
        - errors\.(Join|Unwrap)\(
        - \.Err\(
        - context\.Cause\(
        - (fs|filepath)\.WalkDir\(
        - filepath\.Walk\(
        - \(\*flag\.FlagSet\)\.Parse\(
        - \bio/fs\.(ReadFile|ReadDir|Stat)\(
        - \(io/fs\.(FS|DirEntry)\)\.(Open|Info)\(
        - \bcmp\.Or\[
        - \(\*go\.yaml\.in/yaml/v3\.Node\)\.Decode\(
      ignore-package-globs:
        - go.dokimi.dev/eidos/*
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      - (^|/)testdata($|/)
    rules:
      # A table or a fixture of a test exists once per test, so its layout and its size do not
      # matter.
      - path: _test\.go$
        linters: [govet]
        text: "fieldalignment:"
      - path: _test\.go$
        linters: [gocritic]
        text: "(hugeParam|rangeValCopy):"
      # A test states its values inline, because the value is the assertion.
      - path: _test\.go$
        linters: [goconst, gosec]
      # A failed type assertion or an unused parameter in a test fails the test, which is the
      # signal these linters exist for.
      - path: _test\.go$
        linters: [forcetypeassert, unparam]
      # A test file puts its fakes and helpers below the tests that use them, in reading order.
      - path: _test\.go$
        linters: [funcorder]
      # A fake of a test returns a nil value with a nil error on purpose, to prove the guard
      # against a broken value-or-error contract.
      - path: _test\.go$
        linters: [nilnil]
      # A spec mirrors its source file, so the specs of two similar files repeat each other.
      - path: _test\.go$
        linters: [dupl]
      # A test and the code of a generator return the errors of the code that they call unchanged.
      # A test checks such an error with errors.Is, and a generator has no context to add.
      - path: (_test|[._]gen)\.go$
        linters: [wrapcheck]
      # A test of an allocation ceiling, of an environment variable or of the test binary as a
      # process runs serially, and its name ends in Allocs, Env or Process.
      # testing.AllocsPerRun and t.Setenv panic in a parallel test, and two processes that exit
      # in the same nanosecond write one coverage file.
      - path: _test\.go$
        linters: [paralleltest, tparallel]
        text: 'Test\w*(Allocs|Env|Process)\b'
      # The API of the kernel and of the plugins takes the value types of eidos, such as symbol
      # identities, views and subjects, by value.
      - linters: [gocritic]
        text: "(hugeParam|rangeValCopy):"
      # cgo rewrites a call that passes a Go pointer to C into a pointer check whose second
      # argument is 0 == 0, and dupSubExpr reports that comparison at the call. The source is the
      # call alone.
      - linters: [gocritic]
        text: "dupSubExpr: suspicious identical LHS and RHS for `==` operator"
        source: "\\bC\\.\\w+\\("
      # fieldalignment reports a struct that a field order makes larger, and a struct whose
      # pointers come after other fields. The second report saves no memory. The order that it
      # asks for replaces the reading order of the fields, and the docblocks and the symbol schema
      # follow the reading order.
      - linters: [govet]
        text: "fieldalignment: .* leading bytes of pointer data"
      # eidos panics on a misuse of its API and on a broken invariant, as its docblocks state. A
      # Must registration that fails, a gate with a zero key and a plugin of emitter rules that
      # does not lower to a generator each panic, because no caller can handle the error. The
      # tests panic in the same cases, and the tests of the dispatch panic on purpose to check
      # that the caller receives the panic of a handler.
      - linters: [forbidigo]
        text: "use of `panic` forbidden"
      # The kernel applies the buffered appends of a phase call in effects.go, seals the store of
      # a plan in plugin/, and tests both in emit/ and plugin/. The paths are relative to each
      # module, and no plugin module has these paths outside its generated facade.
      - path: ^(effects\.go|emit/|plugin/)
        linters: [forbidigo]
        text: "emit\\.(AppendSealed|Seal)"
      # The encoders of the sealed state and of a unit's key write counts, offsets, lengths,
      # rounds and places, which are never negative, as unsigned integers. The decoders read them
      # back through the checked reads of the wire decoder.
      - path: (internal/state/|frontend/load/key\.go)
        linters: [gosec]
        text: "G115: integer overflow conversion int(64)? -> uint(32|64)"
      # The journal of a phase call stores the bounds of its spans as int32, which halves the
      # size of a span and limits one call to 2^31 entries of each kind.
      - path: ^(journal|effects)\.go$
        linters: [gosec]
        text: "G115: integer overflow conversion int -> int32"
      # A registry numbers its keys with uint32 IDs in registration order, and a composition
      # registers far fewer keys than a uint32 counts.
      - path: meta/registry\.go
        linters: [gosec]
        text: "G115:"
      # The string table checks each count and each length against the bytes left before it
      # converts the value.
      - path: node/stringtable\.go
        linters: [gosec]
        text: "G115:"
      # A size checks a count against math.MaxInt64 divided by the bytes of its unit, a positive
      # constant, before it multiplies the two.
      - path: internal/config/bytes\.go
        linters: [gosec]
        text: "G115:"
      # The class-file reader and the marker of a Java literal reinterpret the bits of an int, a
      # long and a char as the JVM and the Java language define them. A printable code unit is
      # ASCII, so it fits a byte.
      - path: frontend/(classfile/(pool|literal)|marker)\.go
        linters: [gosec]
        text: "G115:"
      # A backend writes the code point of a rune that it ranged over a string as the digits of an
      # escape, and such a rune is never negative.
      - path: backend/(value|imports)\.go
        linters: [gosec]
        text: "G115: integer overflow conversion rune -> uint64"
      # The evaluator converts between int32 and uint32 as ECMAScript's ToInt32 and ToUint32
      # define them for the shift and bitwise operators.
      - path: rules/evaluate\.go
        linters: [gosec]
        text: "G115: integer overflow conversion (int32 -> uint32|uint32 -> int32)"
      # The spoke and the rules of a language start each refusal with the name of the language,
      # such as go: or protobuf:. A finding quotes the refusal beside the refusals of other
      # languages. A spoke adds the name where it returns a refusal, so the text of a nested
      # refusal starts without it.
      - path: (spell/type|rules/(rules|resolve))\.go
        linters: [errorprefix]
      # A backend starts each refusal with the name of its language for the same reason, and a
      # refusal of a fixed text is a sentinel that errors.New declares.
      - path: ^backend/
        linters: [errorprefix]
        text: 'the text "(go|graphql|java|kotlin|php|protobuf|rust|typescript): '
      # passLine is the text that the test driver of the Java adapter prints for a passing test.
      # It is no credential.
      - path: testing/adapter\.go
        linters: [gosec]
        text: "G101:"
        source: passLine
      # Maven and Gradle record the SHA-1 of an artifact, and the Java frontend compares the
      # SHA-1 of a JAR with the recorded one to detect a corrupt download. The digest is no
      # security check.
      - path: frontend/depend\.go
        linters: [gosec]
        text: "G(401|505):"
      # A staging file needs a name that no other writer takes, and its writer creates it
      # exclusively. A writer that guesses the name of the staging file of another writer makes
      # that writer fail. A writer of the directory can make it fail without the guess.
      - path: internal/stagefile/stagefile\.go
        linters: [gosec]
        text: "G404:"
      # A load and the parse of one crate keep the context of their call in the state of that
      # call. The record of a load, the record of the phases and the parse memo keep the context
      # of the run that opened them. They implement the prior and the memo of a load and the bag
      # source of a fact store. The methods of these interfaces take no context, so the three
      # types read the ledger under the context of the run.
      - path: (frontend/load/load|internal/state/(loadrecord|memo|phases)|frontend/parse)\.go
        linters: [containedctx]
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  # gci groups the standard library apart from every other import. A repository puts its own
  # modules in a group of their own by adding gci's sections in its local file, such as standard,
  # default and the prefix of its module paths.
  settings:
    gofumpt:
      extra:
        group-params: true
    golines:
      max-len: 120
    # The modules of eidos form an import group of their own.
    gci:
      sections:
        - standard
        - default
        - prefix(go.dokimi.dev/eidos)
      custom-order: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  fix: false
severity:
  default: error
