version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true

output:
  show-stats: true
  sort-order:
    - linter
    - severity
    - file

linters:
  default: none
  enable:
    # Correctness
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - forcetypeassert
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnil
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    # Modernization
    - modernize
    - unparam
    # Style
    - dupword
    - funcorder
    - gocritic
    - misspell
    - nolintlint
    - predeclared
    - reassign
    - revive
    - usestdlibvars
    # Concurrency
    - asasalint
    - contextcheck
    - errname
    - noctx
    # Test hygiene
    - thelper
    - tparallel
    - usetesting

  settings:
    funcorder:
      constructor: true
      struct-method: true

    gocritic:
      enabled-tags: [diagnostic]
      disabled-checks:
        - ifElseChain

    revive:
      severity: warning
      rules:
        - name: context-as-argument
        - name: var-naming
        - name: package-comments
        - name: receiver-naming
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: indent-error-flow
        - name: early-return
        - name: unused-receiver
        - name: blank-imports
        - name: range
        - name: time-naming
        - name: unexported-return
        - name: exported

    govet:
      enable-all: true

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      - "(^|/)testdata($|/)"
    rules:
      # fieldalignment is noise outside hot-path structs.
      - linters: [govet]
        text: "fieldalignment:"
      # A failed assertion or unused parameter in a test fails the
      # test, which is the signal those linters exist to produce.
      - path: _test\.go$
        linters: [forcetypeassert, unparam]
      # Test files put fakes and helper types below the tests that
      # use them, which reads better and which decorder scores as
      # "type after func". Declaration order in a test file is about
      # reading order, not about API shape.
      - path: _test\.go$
        linters: [decorder, funcorder]

formatters:
  enable:
    - gci
    - gofumpt
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(go.dokimi.dev/eidos)
      custom-order: true
    golines:
      max-len: 120
    gofumpt:
      group-params: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  fix: false

severity:
  default: error
