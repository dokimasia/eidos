version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true

output:
  show-stats: true
  sort-order:
    - linter
    - severity
    - file

linters:
  default: none
  enable:
    # Correctness
    - copyloopvar
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - forcetypeassert
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnil
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    # Modernization
    - modernize
    - unparam
    # Style
    - dupword
    - funcorder
    - gocritic
    - misspell
    - nolintlint
    - predeclared
    - reassign
    - revive
    - usestdlibvars
    # Concurrency
    - asasalint
    - contextcheck
    - errname
    - noctx
    # Test hygiene
    - thelper
    - tparallel
    - usetesting

  settings:
    depguard:
      rules:
        # Plugin modules speak the facade alone (RFC-0012); the
        # kernel arrives transitively through go.dokimi.dev/eidos/sdk.
        # eidos-reference stays out: a reference composition is host
        # side and composes the workspace, which the facade does not
        # re-export.
        plugin-modules:
          files:
            - "**/eidos-lang/**"
            - "**/eidos-lang-go/**"
            - "**/eidos-lang-java/**"
            - "**/eidos-lang-kotlin/**"
            - "**/eidos-lang-php/**"
            - "**/eidos-lang-protobuf/**"
            - "**/eidos-lang-rust/**"
            - "**/eidos-lang-typescript/**"
            - "**/eidos-plugin-shape/**"
          deny:
            - pkg: go.dokimi.dev/eidos/core
              desc: plugin source speaks the facade; import go.dokimi.dev/eidos/sdk instead

        # The read side parses source into the graph and never
        # renders: core/frontend reaches the store and the node
        # builders, and knows nothing of emit or the write side.
        frontend-seam:
          files:
            - "**/eidos-core/frontend/**"
          deny:
            - pkg: go.dokimi.dev/eidos/core/emit
              desc: the read side loads declarations; emit is the write side's vocabulary
            - pkg: go.dokimi.dev/eidos/core/backend
              desc: the read side never renders

        # The write side renders a settled store and never loads:
        # core/backend works on the SPI and the emit vocabulary, and
        # reaches neither the graph builders nor the read side.
        backend-seam:
          files:
            - "**/eidos-core/backend/**"
          deny:
            - pkg: go.dokimi.dev/eidos/core/node
              desc: the write side renders what the store settled; node builds the graph
            - pkg: go.dokimi.dev/eidos/core/store
              desc: the write side reads its subjects through the render context, not the store
            - pkg: go.dokimi.dev/eidos/core/frontend
              desc: the write side never loads

    funcorder:
      constructor: true
      struct-method: true

    gocritic:
      enabled-tags: [diagnostic]
      disabled-checks:
        - ifElseChain

    revive:
      severity: warning
      rules:
        - name: context-as-argument
        - name: var-naming
        - name: package-comments
        - name: receiver-naming
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: indent-error-flow
        - name: early-return
        - name: unused-receiver
        - name: blank-imports
        - name: range
        - name: time-naming
        - name: unexported-return
        - name: exported

    govet:
      enable-all: true

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      - "(^|/)testdata($|/)"
    rules:
      # fieldalignment is noise outside hot-path structs.
      - linters: [govet]
        text: "fieldalignment:"
      # A failed assertion or unused parameter in a test fails the
      # test, which is the signal those linters exist to produce.
      - path: _test\.go$
        linters: [forcetypeassert, unparam]
      # Test files put fakes and helper types below the tests that
      # use them, which reads better and which decorder scores as
      # "type after func". Declaration order in a test file is about
      # reading order, not about API shape.
      - path: _test\.go$
        linters: [decorder, funcorder]

formatters:
  enable:
    - gci
    - gofumpt
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(go.dokimi.dev/eidos)
      custom-order: true
    golines:
      max-len: 120
    gofumpt:
      group-params: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  fix: false

severity:
  default: error
