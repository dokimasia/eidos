edition = "2023";

package acme.store;

import "acme/kinds/schema.proto";

option go_package = "example.com/acme/store";

// Row is one record of the store.
message Row {
  string id = 1;
  int32 count = 2 [features.field_presence = IMPLICIT];
  Result result = 3 [features.message_encoding = DELIMITED];
  acme.kinds.Color color = 4 [default = GREEN];
  string key = 5 [features.field_presence = LEGACY_REQUIRED];
  repeated int32 ids = 6 [features.repeated_field_encoding = EXPANDED];
  // Result is the result of the last check.
  message Result {
    string code = 1;
  }
}

// Store serves rows.
service Store {
  rpc Get(Row) returns (Row);
}
