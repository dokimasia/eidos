// Schema of the orders, in the order of its source.
syntax = "proto3";

package acme.order;

import "google/protobuf/timestamp.proto";
import "acme/kinds/schema.proto";

// Order declares its nested types before its fields.
message Order {
  // GoogleRE2 keeps its run of capitals.
  message GoogleRE2 {}
  // Protocol keeps the names of its values.
  enum Protocol {
    TLS_AUTO = 0;
    TLSv1_0 = 1;
    v4 = 2;
  }
  string id = 1;
  oneof engine {
    GoogleRE2 google_re2 = 2;
  }
  google.protobuf.Timestamp placed = 3;
  acme.kinds.Color color = 4;
  oneof via {
    Protocol protocol = 5;
  }
}

// Orders serves orders.
service Orders {
  // Get takes a body without options.
  rpc Get(Order) returns (Order) {}
}
